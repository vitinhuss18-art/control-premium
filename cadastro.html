<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro — Control$ Premium</title>
<style>
  :root {
    --bg: #0A0A0F;
    --surface: #12121A;
    --surface2: #1A1A2E;
    --surface3: #252540;
    --primary: #FFD700;
    --error: #FF5252;
    --purple: #B388FF;
    --grey: #9E9E9E;
    --grey2: #6A6A7A;
    --divider: rgba(255,255,255,0.06);
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0A0A0F;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    background-image: radial-gradient(ellipse at top left, rgba(255,215,0,0.03) 0%, transparent 50%),
                      radial-gradient(ellipse at bottom right, rgba(179,136,255,0.03) 0%, transparent 50%);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px 28px;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
    background: linear-gradient(135deg, var(--primary), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub { color: var(--grey); font-size: 14px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: var(--grey); margin: 16px 0 6px; }
  input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--divider);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    color: #fff;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: var(--primary); }
  button {
    width: 100%;
    margin-top: 24px;
    background: linear-gradient(135deg, var(--primary), #FFB300);
    color: #0A0A0F;
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: var(--radius-sm);
    padding: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: 14px; padding: 12px; border-radius: var(--radius-sm); display: none; }
  .msg.error { background: rgba(255,82,82,0.1); color: var(--error); display: block; }
  .msg.success { background: rgba(255,215,0,0.1); color: var(--primary); display: block; }
  .estado-invalido, .estado-carregando { text-align: center; padding: 40px 0; color: var(--grey); }
</style>
</head>
<body>

  <div class="card" id="cardFormulario" style="display:none;">
    <h1>Criar minha conta</h1>
    <p class="sub">Preencha seus dados para começar.</p>
    <form id="formCadastro">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" required autocomplete="name">

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" required inputmode="numeric" placeholder="000.000.000-00">

      <label for="whats">WhatsApp</label>
      <input type="tel" id="whats" required inputmode="tel" placeholder="(00) 00000-0000">

      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="email">

      <label for="senha">Crie uma senha</label>
      <input type="password" id="senha" required minlength="8" autocomplete="new-password">

      <button type="submit" id="btnEnviar">Criar minha conta</button>
      <div class="msg" id="mensagem"></div>
    </form>
  </div>

  <div class="card estado-carregando" id="cardCarregando">
    Carregando...
  </div>

  <div class="card estado-invalido" id="cardInvalido" style="display:none;">
    <h1 style="background:none;color:#fff;">Link inválido</h1>
    <p class="sub" style="margin-top:8px;">Este link de cadastro não é válido ou já expirou. Peça um novo link a quem te convidou.</p>
  </div>

  <div class="card" id="cardSucesso" style="display:none;">
    <h1>Conta criada! 🎉</h1>
    <p class="sub" style="margin-top:8px;color:#fff;">
      Enviamos um e-mail de confirmação. Depois de confirmar, você já pode fazer login normalmente.
    </p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  var SUPABASE_URL = 'https://ymayqjphgwvxekgxxolt.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_l3fdH2Nd_U2CyRvS1GFhkw_g3ceVXxh';
  var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function mostrarCard(id) {
    ['cardFormulario', 'cardCarregando', 'cardInvalido', 'cardSucesso'].forEach(function (cardId) {
      document.getElementById(cardId).style.display = cardId === id ? 'block' : 'none';
    });
  }

  function pegarTokenDaUrl() {
    var params = new URLSearchParams(window.location.search);
    return params.get('token');
  }

  var token = pegarTokenDaUrl();
  if (!token) {
    mostrarCard('cardInvalido');
    return;
  }

  // Não validamos o token contra o banco antes do cadastro (o próprio banco valida
  // na hora de gravar, via register_client_via_link). Isso evita expor se um token
  // existe ou não para quem só está tentando adivinhar tokens.
  mostrarCard('cardFormulario');

  document.getElementById('formCadastro').addEventListener('submit', async function (evento) {
    evento.preventDefault();
    var botao = document.getElementById('btnEnviar');
    var mensagem = document.getElementById('mensagem');
    mensagem.className = 'msg';
    mensagem.textContent = '';
    botao.disabled = true;
    botao.textContent = 'Enviando...';

    var nome = document.getElementById('nome').value.trim();
    var cpf = document.getElementById('cpf').value.trim();
    var whats = document.getElementById('whats').value.trim();
    var email = document.getElementById('email').value.trim();
    var senha = document.getElementById('senha').value;

    try {
      var signUpResult = await supabaseClient.auth.signUp({ email: email, password: senha });
      if (signUpResult.error) throw signUpResult.error;
      if (!signUpResult.data.session) {
        // Confirmação de e-mail está ativada: ainda não há sessão autenticada.
        // Não dá pra chamar register_client_via_link sem sessão, então orientamos
        // o cliente a confirmar o e-mail e cadastramos os dados só depois do primeiro login.
        sessionStorage.setItem(
          'cadastroPendente',
          JSON.stringify({ token: token, nome: nome, cpf: cpf, whats: whats, email: email })
        );
        mostrarCard('cardSucesso');
        return;
      }

      var rpcResult = await supabaseClient.rpc('register_client_via_link', {
        p_link_token: token,
        p_full_name: nome,
        p_cpf: cpf,
        p_phone: whats,
        p_email: email
      });
      if (rpcResult.error) throw rpcResult.error;

      mostrarCard('cardSucesso');
    } catch (erro) {
      mensagem.className = 'msg error';
      mensagem.textContent = erro.message || 'Não foi possível concluir o cadastro. Tente novamente.';
      botao.disabled = false;
      botao.textContent = 'Criar minha conta';
    }
  });
})();
</script>
</body>
</html>
